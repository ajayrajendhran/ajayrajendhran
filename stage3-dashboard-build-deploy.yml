name: STAGE3 - Dashboard Build and Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release Tag
        default: latest
        required: true

permissions:
      id-token: write
      contents: read

jobs:
  build:
    name: Build Stage Dashboard
    runs-on: ubuntu-latest
    environment: staging
    steps:
    - name: Build Initiated
      if: always()
      id: build-initiated
      uses: slackapi/slack-github-action@v1.24.0
      with:
            payload: |
                {
                    "attachments":
                    [
                        {
                            "mrkdwn_in": ["text"],
                            "color": "#36a64f",
                            "pretext": "STAGE3 Dashboard Build Initiated",
                            "author_name": "${{ github.actor }}",
                            "text": ":rocket: Building with `${{ github.ref_name }}` in STAGE3"
                        }
                    ]
                }

      env:
            SLACK_WEBHOOK_URL: ${{ secrets.STAGE_SLACK_WEBHOOK }}
            SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
          role-to-assume: arn:aws:iam::780533555440:role/github_actions_OIDC
          aws-region: us-west-2
  
    - name: Check out code
      uses: actions/checkout@v2

    - name: Checkout Grafana repository
      uses: actions/checkout@v4
      with:
        repository: rheo-ai/grafana-plugins
        token: ${{ secrets.GIT_PAT }}
        path:  ${{ github.workspace }}/grafana-plugins

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies including Ansible
      run: |
        python -m pip install --upgrade pip
        pip install -r deployment-scripts/requirements.txt

    - name: Build, tag, and push image to Amazon ECR
      run: |
        ansible-playbook -vv deployment-scripts/dashboard_build.yml -e "env=stage3"


    - name: Build Completed
      if: success()
      id: build-success
      uses: slackapi/slack-github-action@v1.24.0
      with:
          payload: |
              {
                  "attachments":
                  [
                      {
                          "mrkdwn_in": ["text"],
                          "color": "#36a64f",
                          "pretext": "STAGE3 Dashboard Build Succeeded",
                          "author_name": "${{ github.actor }}",
                          "text": ":star-struck: :white_check_mark: Build succeeded with `${{ github.ref_name }}` on STAGE3"
                      }
                  ]
              }

      env:
          SLACK_WEBHOOK_URL: ${{ secrets.STAGE_SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    - name: Build Failed
      if: failure()
      id: build-failed
      uses: slackapi/slack-github-action@v1.24.0
      with:
          payload: |
              {
                  "attachments":
                  [
                      {
                          "mrkdwn_in": ["text"],
                          "color": "#FF0000",
                          "pretext": "STAGE3 Dashboard Build Failed <!subteam^S05V1EJCFJT|@devsecops-team>",
                          "author_name": "${{ github.actor }}",
                          "text": ":mild-panic-intensifies: :x: Build Failed with `${{ github.ref_name }}` on STAGE3"
                      }
                  ]
              }

      env:
          SLACK_WEBHOOK_URL: ${{ secrets.STAGE_SLACK_WEBHOOK }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK


  deploy:
    name: Deploy STAGE Dashboard
    runs-on: stage-runner
    environment: staging
    needs: build
    steps:
    -   name: Deploy Initiated
        if: always()
        id: deploy-initiated
        uses: slackapi/slack-github-action@v1.24.0
        with:
            payload: |
                {
                    "attachments":
                    [
                        {
                            "mrkdwn_in": ["text"],
                            "color": "#36a64f",
                            "pretext": "STAGE3 Dashboard Deployment Initiated",
                            "author_name": "${{ github.actor }}",
                            "text": ":rocket: Deploying `${{ github.ref_name }}` to STAGE3"
                        }
                    ]
                }

        env:
            SLACK_WEBHOOK_URL: ${{ secrets.STAGE_SLACK_WEBHOOK }}
            SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      # Check out code
    - name: Check out code
      uses: actions/checkout@v2

    - name: Deploy
      if: success()
      run: |
        ansible-playbook -vv --private-key /home/ubuntu/.ssh/id_rsa -i deployment-scripts/inventory_aws_ec2.yml deployment-scripts/dashboard_deploy.yml -e "env=stage3" -e "host=tag_Name_stage3_replica"


    -   name: Deploy Completed
        if: success()
        id: deploy-success
        uses: slackapi/slack-github-action@v1.24.0
        with:
            payload: |
                {
                    "attachments":
                    [
                        {
                            "mrkdwn_in": ["text"],
                            "color": "#36a64f",
                            "pretext": "STAGE3 Dashboard Deployment Succeeded",
                            "author_name": "${{ github.actor }}",
                            "text": ":star-struck: :white_check_mark: Deployment Succeeded `${{ github.ref_name }}` to STAGE3"
                        }
                    ]
                }

        env:
            SLACK_WEBHOOK_URL: ${{ secrets.STAGE_SLACK_WEBHOOK }}
            SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

    -   name: Deploy Failed
        if: failure()
        id: deploy-failed
        uses: slackapi/slack-github-action@v1.24.0
        with:
            payload: |
                {
                    "attachments":
                    [
                        {
                            "mrkdwn_in": ["text"],
                            "color": "#FF0000",
                            "pretext": "STAGE3 Dashboard Deployment Failed <!subteam^S05V1EJCFJT|@devsecops-team>",
                            "author_name": "${{ github.actor }}",
                            "text": ":mild-panic-intensifies: :x: Failed Deploying `${{ github.ref_name }}` to STAGE3"
                        }
                    ]
                }

        env:
            SLACK_WEBHOOK_URL: ${{ secrets.STAGE_SLACK_WEBHOOK }}
            SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
            